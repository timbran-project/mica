[package]
name = "mica-runtime"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Live Mica runtime environment"

[features]
default = ["cranelift", "fjall", "source-provider"]
cranelift = ["mica-vm/cranelift"]
fjall = ["mica-relation-kernel/fjall-provider"]
source-provider = ["dep:mica-source-provider"]

[dependencies]
base64.workspace = true
fast-telemetry.workspace = true
mica-compiler.workspace = true
mica-host-protocol.workspace = true
mica-relation-kernel.workspace = true
mica-source-provider = { workspace = true, optional = true }
mica-var.workspace = true
mica-vm.workspace = true
serde_json.workspace = true
tracing.workspace = true
xml.workspace = true

[dev-dependencies]
micromeasure.workspace = true

[[bench]]
name = "task_benches"
harness = false

[[bench]]
name = "relation_lifecycle_benches"
harness = false
