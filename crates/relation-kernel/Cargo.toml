[package]
name = "mica-relation-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "MVCC relation kernel for Mica"

[features]
default = ["fjall-provider"]
fjall-provider = ["dep:fjall"]

[dependencies]
arc-swap.workspace = true
fast-telemetry.workspace = true
fjall = { workspace = true, optional = true }
mica-var.workspace = true
rart.workspace = true
rayon.workspace = true

[dev-dependencies]
micromeasure.workspace = true

[[example]]
name = "buffer_persistence_probe"
required-features = ["fjall-provider"]

[[bench]]
name = "relation_index_benches"
harness = false

[[bench]]
name = "relation_join_rule_benches"
harness = false

[[bench]]
name = "relation_value_benches"
harness = false

[[bench]]
name = "transaction_overlay_benches"
harness = false

[[bench]]
name = "relation_durability_benches"
harness = false
