[package]
name = "mica-driver"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Compio-driven task driver for Mica"

[features]
default = ["cranelift", "fjall", "source-provider", "wgpu"]
cranelift = ["mica-runtime/cranelift"]
fjall = ["mica-runtime/fjall"]
source-provider = ["mica-runtime/source-provider"]
wgpu = ["dep:mica-relation-wgpu"]

[dependencies]
compio.workspace = true
fast-telemetry.workspace = true
futures-util.workspace = true
mica-compiler.workspace = true
mica-relation-wgpu = { workspace = true, optional = true }
mica-runtime.workspace = true
mica-var.workspace = true
tracing.workspace = true
